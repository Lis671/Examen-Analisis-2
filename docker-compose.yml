services:
  mysql:
    image: mysql:8.4
    container_name: citas_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: citas_medicas
      MYSQL_USER: citas
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
      TZ: America/Guatemala
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    driver: local
